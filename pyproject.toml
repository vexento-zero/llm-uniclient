[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_uniclient"
version = "0.1.1"
description = "A unified interface for various LLM providers with reasoning content support."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "openai",
    "requests",
    "json-repair",
    "tqdm",
    "rich-logger",
]

[tool.uv.sources]
rich-logger = { git = "https://github.com/vexento-zero/rich-logger.git" }

[tool.setuptools.packages.find]
where = ["src"]
